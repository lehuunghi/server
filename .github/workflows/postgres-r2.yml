name: PostgreSQL and R2 defaults

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "tests/**"
      - "Cargo.*"
      - "install.sh"
      - "install-auto.sh"
      - "resources/scripts/**"
      - "resources/deployment/**"
      - ".github/workflows/postgres-r2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-r2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check installer behavior
        env:
          TEST_DOCKER_COMPOSE: "1"
        run: |
          python3 resources/scripts/test_install.py
          python3 resources/scripts/test_auto_setup.py
          sh -n install-auto.sh
          sh install-auto.sh --help
      - name: Validate Docker Compose configuration
        env:
          STALWART_POSTGRES_PASSWORD: disposable-test-password
        run: |
          cp resources/deployment/.env.example resources/deployment/.env
          docker compose --env-file resources/deployment/.env -f resources/deployment/compose.yaml config --quiet

  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUST_MIN_STACK: "16777216"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check default server build
        run: cargo check -p stalwart
      - name: Check initial storage defaults and environment overrides
        run: cargo test -p stalwart -p jmap bootstrap_defaults_tests -- --nocapture
      - name: Test PostgreSQL and S3 storage against disposable containers
        env:
          STORE: PostgreSql
          BLOB_STORE: S3
        run: |
          cargo test -p tests --features "postgres s3" store:: -- --nocapture --test-threads=1
      - name: Build server for unattended bootstrap verification
        run: cargo build -p stalwart
      - name: Verify unattended setup against the running server
        run: sudo -E python3 resources/scripts/test_auto_setup_live.py --binary "$PWD/target/debug/stalwart"
